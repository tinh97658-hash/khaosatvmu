services:
  db:
    image: postgres:15-alpine
    container_name: khaosatvmu_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khaosatvmu@123}
      POSTGRES_DB: ${POSTGRES_DB:-khaosatvmu}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # pgAdmin dùng chung mạng với db nên khai báo server theo host "db" cổng 5432
  # (cổng nội bộ container), không phải cổng đã map ra máy thật.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: khaosatvmu_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@vmu.edu.vn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-khaosatvmu@123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Phải là FILE. Nếu file này bị xóa, Docker sẽ tạo một thư mục trùng tên
      # và container không khởi động được.
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db

volumes:
  postgres_data:
  pgadmin_data:
