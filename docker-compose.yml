services:
  db:
    image: postgres:15-alpine
    container_name: khaosatvmu_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khaosatvmu@123}
      POSTGRES_DB: ${POSTGRES_DB:-khaosatvmu}
    command:
      - "postgres"
      - "-c"
      - "max_connections=350"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # pgAdmin dùng chung mạng với db nên khai báo server theo host "db" cổng 5432
  # (cổng nội bộ container), không phải cổng đã map ra máy thật.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: khaosatvmu_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@vmu.edu.vn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-khaosatvmu@123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Phải là FILE. Nếu file này bị xóa, Docker sẽ tạo một thư mục trùng tên
      # và container không khởi động được.
      - ./deploy/pgadmin/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db

volumes:
  postgres_data:
  pgadmin_data:
