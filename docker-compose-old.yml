services:
  # 1. Database: PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: khaosatvmu_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khaosatvmu@123}
      POSTGRES_DB: ${POSTGRES_DB:-khaosatvmu}
    ports:
      - "${POSTGRES_PORT:-5432}:5432" # Host:Container
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # 2. Backend: ASP.NET Core API
  backend:
    build:
      context: ./src/Backend
      dockerfile: API/Dockerfile
    container_name: khaosatvmu_backend
    restart: on-failure
    ports:
      - "${BACKEND_PORT:-5000}:8080" # Host:Container (.NET 8 máº·c Ä‘á»‹nh 8080)
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-khaosatvmu};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-khaosatvmu@123}
    depends_on:
      - db
    networks:
      - app-network

  # 3. Frontend: React + Vite
  frontend:
    build:
      context: ./src/Frontend
      dockerfile: Dockerfile
    container_name: khaosatvmu_frontend
    restart: on-failure
    ports:
      - "${FRONTEND_PORT:-5173}:5173" # Host:Container (Vite máº·c Ä‘á»‹nh 5173)
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
